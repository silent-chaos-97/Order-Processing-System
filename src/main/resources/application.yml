spring:
  application:
    name: order-processing-system

  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: orderuser
    password: orderpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

order-processing:
  # Interval at which PENDING orders are automatically promoted to PROCESSING (5 minutes)
  pending-to-processing-interval-ms: 300000
